[workspace]
members = [
    "src-tauri",
    "crates/ats-kernel",
    "crates/ats-runtime",
    "crates/ats-game-context",
    "crates/ats-game-sts2",
    "crates/ats-workspace",
    "crates/ats-features",
    "crates/ats-adapters",
    "crates/ats-web",
    "crates/ats-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["AgentTheSpire contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# clippy::all (correctness + suspicious + style + complexity + perf) 当 error。
# pedantic 已撤回 —— 大量 cast_possible_truncation / must_use_candidate /
# doc_markdown 等噪音 lint 不值得维护，详见 CLAUDE.md "Clippy 策略" 一节。

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
