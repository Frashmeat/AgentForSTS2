name: Rust CI

# 触发：rust 分支 push + PR。main 分支保留 Python 端不在 CI 范围。
on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:

# 同分支同 PR 的旧 run 自动取消，节省额度
concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"  # 编译期 warning 也当 error（不含 clippy）

jobs:
  # --- 主 CI：Linux 跑 cargo check / test + 前端构建 ---
  rust-and-frontend:
    name: cargo + frontend (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # rust-toolchain.toml 在仓库根，rustup 自动读
        run: |
          rustc --version
          cargo --version
          rustup show

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-stable

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vite build
        run: npm run build:web

  # --- Clippy 单独 job：当前 pedantic 警告未清；不阻塞主 CI，只跑趋势观察。 ---
  clippy:
    name: clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-stable
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
