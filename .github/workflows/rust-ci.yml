name: Rust CI

# 触发：rust 分支 push + PR。main 分支保留 Python 端不在 CI 范围。
on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:

# 同分支同 PR 的旧 run 自动取消，节省额度
concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"  # 编译期 warning 也当 error（不含 clippy）

jobs:
  # --- 主 CI：Linux 跑 cargo check / test + 前端构建 ---
  rust-and-frontend:
    name: cargo + frontend (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (Tauri / glib / webkit2gtk)
        # 与 Dockerfile.ci 同步：Tauri Linux 编译链所需系统包。
        # 改 yaml 时务必同步 Dockerfile.ci，否则本地 ci-local.ps1 与远端会失真。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            patchelf

      # === 前端先构建：ats-web 用 rust-embed 把 dist/ 嵌进二进制，
      # cargo check / test 都依赖 dist/ 存在，所以 npm 步骤必须早于 cargo。===
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vite build (generates dist/ that rust-embed needs)
        run: npm run build:web

      - name: Install Rust toolchain
        # rust-toolchain.toml 在仓库根，rustup 自动读
        run: |
          rustc --version
          cargo --version
          rustup show

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-stable

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

  # --- Clippy 强制门槛：警告即报错（pedantic 已撤回，留 clippy::all） ---
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps (Tauri / glib / webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            patchelf
      # ats-web 用 rust-embed 嵌 dist/，cargo clippy 也需要它存在。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: npm ci + vite build
        run: |
          npm ci
          npm run build:web
      - name: Show toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-stable
      - name: cargo clippy
        # RUSTFLAGS=-D warnings 已把 clippy 提升为 error；显式 -- -D warnings 兜底
        run: cargo clippy --workspace --all-targets -- -D warnings
