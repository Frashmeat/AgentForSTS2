[package]
name = "agentthespire-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AgentTheSpire desktop workstation"

[lib]
name = "agentthespire_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[features]
default = []
# Candidate identity feature. Stage 2 media execution is registered separately from shell identity.
ml-rembg = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ats-adapters = { path = "../crates/ats-adapters" }
ats-features = { path = "../crates/ats-features" }
ats-game-context = { path = "../crates/ats-game-context" }
ats-kernel = { path = "../crates/ats-kernel" }
ats-runtime = { path = "../crates/ats-runtime" }
ats-workspace = { path = "../crates/ats-workspace" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-wdio = { version = "1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"
chrono = "0.4"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
