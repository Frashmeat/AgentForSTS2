[package]
name = "ats-features"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ats-kernel = { path = "../ats-kernel" }
ats-runtime = { path = "../ats-runtime" }
ats-game-context = { path = "../ats-game-context" }
ats-workspace = { path = "../ats-workspace" }
base64 = "0.22"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
async-trait = "0.1"
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
