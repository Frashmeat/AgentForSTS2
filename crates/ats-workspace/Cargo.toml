[package]
name = "ats-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ats-kernel = { path = "../ats-kernel" }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
quick-xml = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
