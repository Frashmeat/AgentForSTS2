[package]
name = "ats-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# 仅供桌面 GUI E2E 注入本地 GitHub Releases stub；生产构建不启用。
e2e = []
# 开启 ML 背景去除（u2netp via ort）。默认关，CI 在 feature off 下跑通；
# 用户在 Tauri prod build / 自己开发时 cargo build --features ml-rembg 启用。
# 启用会拉 ~200MB 的 ort + onnxruntime native binaries。Windows 下使用
# load-dynamic/copy-dylibs；运行时由 Tauri prewarm 准备官方 onnxruntime.dll。
ml-rembg = ["dep:ort", "dep:ndarray"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "fs", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
figment = { version = "0.10", features = ["json", "env"] }
regex = "1"
quick-xml = "0.39"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
async-trait = "0.1"
futures-util = "0.3"
eventsource-stream = "0.2"
bytes = "1"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["std", "ndarray", "download-binaries", "load-dynamic", "copy-dylibs"] }
ndarray = { version = "0.16", optional = true }



[dev-dependencies]
tempfile = "3"
